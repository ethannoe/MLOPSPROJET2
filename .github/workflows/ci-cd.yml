name: CI/CD

# Chaque push sur main déclenche toute la chaîne, sans action manuelle.
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 24
  IMAGE_NAME: tp-cicd-app
  CONTAINER_NAME: myapp

jobs:
  # ---------------------------------------------------------------------------
  unit-tests:
    name: 1) Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0 # inutile pour les tests unitaires

      - name: Lancer les tests unitaires
        run: npm test -- --ci

  # ---------------------------------------------------------------------------
  e2e-tests:
    name: 2) Tests E2E (Cypress)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache du binaire Cypress
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installer les dépendances
        run: npm ci

      # Démarre l'application, attend /health, lance Cypress puis arrête l'application
      - name: Lancer les tests E2E
        run: npm run test:e2e

      - name: Captures d'écran en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  build-and-push:
    name: 3-4) Build & push Docker Hub
    needs: [unit-tests, e2e-tests] # uniquement si les tests sont OK
    runs-on: ubuntu-latest
    outputs:
      # Seul le tag est transmis : GitHub supprime les outputs de job qui
      # contiennent un secret (ici le username Docker Hub).
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Calculer le nom et le tag de l'image
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          TAG="${GITHUB_SHA::7}"
          REPO="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          {
            echo "repo=${REPO}"
            echo "tag=${TAG}"
            echo "image=${REPO}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Connexion à Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire l'image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.meta.outputs.tag }} \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }} \
            -t ${{ steps.meta.outputs.repo }}:latest \
            .

      # On vérifie que l'image démarre vraiment avant de la publier
      - name: Smoke test du conteneur
        run: |
          docker run -d --name smoke -p 3000:3000 ${{ steps.meta.outputs.image }}
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors http://localhost:3000/health
          docker rm -f smoke

      - name: Publier l'image sur Docker Hub
        run: |
          docker push ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
          docker push ${{ steps.meta.outputs.repo }}:latest

  # ---------------------------------------------------------------------------
  deploy:
    name: 5-6) Déploiement VM Azure + vérification
    needs: build-and-push
    runs-on: ubuntu-latest
    # Un seul déploiement à la fois : deux pushs rapprochés ne se marchent pas dessus.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      TAG: ${{ needs.build-and-push.outputs.tag }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
    steps:
      - uses: actions/checkout@v7

      - name: Configurer la clé SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$VM_HOST" >> ~/.ssh/known_hosts 2> /dev/null

      - name: Déployer sur la VM (SSH)
        run: |
          IMAGE="$DOCKERHUB_USERNAME/$IMAGE_NAME:$TAG"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            "$VM_USER@$VM_HOST" \
            "bash -s -- '$IMAGE' '$CONTAINER_NAME' 80" < scripts/deploy.sh

      # Vérification depuis l'extérieur, via l'IP publique : le service répond
      # ET c'est bien la version de ce commit qui tourne.
      - name: Healthcheck via l'IP publique
        run: |
          for i in $(seq 1 15); do
            if BODY=$(curl -fsS --max-time 5 "http://$VM_HOST/health"); then
              echo "Réponse : $BODY"
              if echo "$BODY" | jq -e --arg v "$TAG" '.status == "ok" and .version == $v' > /dev/null; then
                echo "OK : version $TAG en ligne sur http://$VM_HOST"
                exit 0
              fi
            fi
            echo "Tentative $i/15 échouée, nouvel essai dans 4s..."
            sleep 4
          done
          echo "L'application ne répond pas correctement sur http://$VM_HOST/health"
          exit 1

      - name: Résumé
        run: |
          {
            echo "### Déploiement réussi"
            echo ""
            echo "- Image : \`$DOCKERHUB_USERNAME/$IMAGE_NAME:$TAG\`"
            echo "- Application : http://$VM_HOST"
            echo "- Healthcheck : http://$VM_HOST/health"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Supprimer la clé SSH du runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
